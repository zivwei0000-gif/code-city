name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build CodeCity.exe
        run: python -m PyInstaller --onefile --windowed --name CodeCity --icon CodeCity.ico code_city.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CodeCity-windows
          path: dist/CodeCity.exe

      - name: Publish release (only when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodeCity.exe
